<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in or create a Nexora account."><title>Account | Nexora</title><link rel="stylesheet" href="styles.css"><script defer src="script.js"></script></head><body data-page="login"><a class="skip-link" href="#main">Skip to content</a><div id="site-header"></div><main id="main" class="auth-page"><section class="auth-card"><div class="auth-intro"><span class="eyebrow">Your Nexora</span><h1>Welcome back.</h1><p>Track orders, save favorites and checkout faster.</p></div><div class="auth-panel"><div class="tabs" role="tablist"><button type="button" class="tab active" data-auth-tab="login" role="tab">Sign in</button><button type="button" class="tab" data-auth-tab="signup" role="tab">Create account</button></div><form id="login-form" class="auth-form" novalidate><label class="field">Email<input name="email" type="email" autocomplete="email" required><small></small></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required minlength="8"><small></small></label><button class="button" type="submit">Sign in</button><p class="form-note">Demo only — authentication requires a secure backend.</p></form><form id="signup-form" class="auth-form" hidden novalidate><label class="field">Full name<input type="text" name="name" autocomplete="name" required minlength="2"><small></small></label><label class="field">Email<input name="email" type="email" autocomplete="email" required><small></small></label><label class="field">Password<input name="password" type="password" autocomplete="new-password" required minlength="8"><small></small></label><label class="field">Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required><small></small></label><label class="check-row"><input name="terms" type="checkbox" required> I agree to the terms and p
